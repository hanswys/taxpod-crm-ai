services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      # 5433 on the host so it doesn't clash with a local Postgres on 5432.
      # Override with DB_PORT in .env (and update DATABASE_URL to match).
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is empty. After editing it: npm run db:reset
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
